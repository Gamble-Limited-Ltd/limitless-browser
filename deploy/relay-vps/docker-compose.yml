# Limitless VPS relay (1.0 S4, docs/1.0/RELAY.md 3.7, docs/1.0/S4-HOST-COMMANDS.md). Runs on the RackNerd VPS (ssh alias
# `limitless-relay`), DNS-only hostname (never proxied by Cloudflare). Compose project name: limitless-relay-vps.
#   tls     nginx on 443 (Let's Encrypt cert for RELAY_HOST), proxies /wisp/ to relaygate, nothing else, no access log
#   relaygate the gate image in GATE_MODE=relay: token check, caps, fair share, byte counts. No members DB, no personal data.
#           It POLLS home every second (outbound HTTPS only); nothing at home is opened.
#   relay   epoxy-server, same image and config as the home stack (deploy/relay), egress through its own filtered network
#   dns     unbound cache for the relay (deploy/dns)
#   certbot Let's Encrypt by HTTP-01 on port 80 (standalone), renews every 12 h
# Secrets are gitignored: .env (host name), relay.env (public token key, sync secret). Examples sit next to this file.
name: limitless-relay-vps

services:
  tls:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      RELAY_HOST: ${RELAY_HOST:?set RELAY_HOST in .env}
      NGINX_ENVSUBST_FILTER: RELAY_
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./site.conf.template:/etc/nginx/templates/site.conf.template:ro
      - ./reload-loop.sh:/docker-entrypoint.d/50-reload-loop.sh:ro
      - certs:/etc/letsencrypt:ro
    networks: [box_front]
    depends_on: [relaygate]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp, /etc/nginx/conf.d]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    logging:
      driver: local
      options: { max-size: "2m", max-file: "2" }

  relaygate:
    image: limitless-gate:${GATE_SHA:-dev}
    build:
      context: ${GATE_CONTEXT:-../../../limitless-gate}
    restart: unless-stopped
    env_file:
      - ./relay.env
    environment:
      GATE_MODE: relay
      PORT: "8080"
      HOST: 0.0.0.0
      RELAY_URL: ws://relay:4000/
      BUILD_SHA: ${GATE_SHA:-dev}
    networks: [box_front, box_relay, box_cert]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 512m
    depends_on: [relay]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: local
      options: { max-size: "5m", max-file: "2" }

  relay:
    image: limitless-relay:${RELAY_SHA:-dev}
    build:
      context: ../relay
    restart: unless-stopped
    networks: [box_relay, box_egress]
    dns: [1.1.1.1, 9.9.9.9]
    depends_on: [dns]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    # The VPS has 2 vCPU and 2 GiB: leave room for relaygate, nginx and the OS.
    mem_limit: 1g
    cpus: 1.5
    logging:
      driver: local
      options: { max-size: "2m", max-file: "2" }

  dns:
    image: limitless-dns:${DNS_SHA:-dev}
    build:
      context: ../dns
    restart: unless-stopped
    networks:
      box_relay:
        ipv4_address: 10.88.81.53
      box_egress: {}
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "nslookup -timeout=2 example.com 127.0.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options: { max-size: "1m", max-file: "2" }

  # ---- load test only (profile `loadtest`, never started by a normal `up`): a second relay-mode gate with its OWN keys plus the
  # runner (scripts/relay-loadtest.ts, in the same gate image) that is its fake home. Real members and the real home are not
  # involved. Boss starts it (S4-HOST-COMMANDS.md section 9). Both sit on the internal network box_lt; the gate also reaches relay.
  relaygate-lt:
    profiles: ["loadtest"]
    image: limitless-gate:${GATE_SHA:-dev}
    env_file: [./loadtest.env]
    environment:
      GATE_MODE: relay
      PORT: "8080"
      HOST: 0.0.0.0
      RELAY_URL: ws://relay:4000/
      RELAY_HOME_URL: http://loadtest:9100
      PUBLIC_ORIGIN: https://limitless.taps-holdings.org
      BANDWIDTH_MBPS: "0"
      BUILD_SHA: ${GATE_SHA:-dev}-lt
    networks: [box_lt, box_relay]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 512m

  loadtest:
    profiles: ["loadtest"]
    image: limitless-gate:${GATE_SHA:-dev}
    # keys.json (from `node scripts/relay-keys.ts --json`) is mounted from ./lt; reports land in ./lt/out
    command: ["node", "scripts/relay-loadtest.ts", "--relay", "ws://relaygate-lt:8080/wisp/", "--keys-file", "/lt/keys.json", "--home-port", "9100", "--mode", "${LT_MODE:-http}", "--target", "${LT_TARGET:?set LT_TARGET host:port}", "--path", "${LT_PATH:-/}", "--members", "${LT_MEMBERS:-20}", "--seconds", "${LT_SECONDS:-30}", "--max-bytes", "${LT_MAX_BYTES:-500000000}", "--cpu-file", "/lt/cpu.txt", "--out", "/lt/out"]
    networks: [box_lt]
    read_only: true
    tmpfs: [/tmp]
    volumes: ["./lt:/lt"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 512m
    depends_on: [relaygate-lt]

  certbot:
    image: certbot/certbot:v3.0.1
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      RELAY_HOST: ${RELAY_HOST:?set RELAY_HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      ACME_STAGING: ${ACME_STAGING:-0}
    entrypoint: ["/bin/sh", "/certbot-loop.sh"]
    volumes:
      - ./certbot-loop.sh:/certbot-loop.sh:ro
      - certs:/etc/letsencrypt
    networks: [box_cert]
    read_only: true
    tmpfs: [/tmp, /var/lib/letsencrypt, /var/log/letsencrypt]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    logging:
      driver: local
      options: { max-size: "1m", max-file: "2" }

networks:
  # load test only: relaygate-lt <-> loadtest, no outside access.
  box_lt:
    internal: true
    ipam: { config: [{ subnet: 10.88.87.0/24 }] }
  # tls <-> relaygate, and the published 443. Nothing initiates outbound here.
  box_front:
    ipam: { config: [{ subnet: 10.88.84.0/24 }] }
  # relaygate <-> relay <-> dns. No outside access at all.
  box_relay:
    internal: true
    ipam: { config: [{ subnet: 10.88.81.0/24 }] }
  # relay's and dns's only way out (public addresses only, see egress-rules.sh).
  box_egress:
    ipam: { config: [{ subnet: 10.88.82.0/24 }] }
  # certbot's and relaygate's way out: Let's Encrypt, and the home poll (public addresses only, see egress-rules.sh).
  box_cert:
    ipam: { config: [{ subnet: 10.88.86.0/24 }] }

volumes:
  certs:
