# Limitless Browser web tier. Fail closed: auth_request is on at server level and switched off only for
# the ungated paths (docs/ACCESS-CONTROL.md section 9). Origin is reachable only on 127.0.0.1:8580
# (Cloudflare Tunnel -> here). Build output: /usr/share/nginx/html (raw + .gz) and /usr/share/nginx/br (brotli).

# Real client IP: only trust the header from the tunnel (host loopback) and the Docker bridge gateway.
# The port is published on 127.0.0.1 only, so nothing else can reach nginx.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
real_ip_header CF-Connecting-IP;

# Brotli without the module: the build writes a parallel tree of .br-compressed files with the SAME names.
# Clients that accept br get that root; Content-Encoding is added only for the compressible types.
map $http_accept_encoding $lb_root {
  default                  /usr/share/nginx/html;
  "~*(^|[ ,])br([ ,;]|$)"  /usr/share/nginx/br;
}
map "$lb_root:$uri" $lb_enc {
  default "";
  "~^/usr/share/nginx/br:.*\.(html|js|mjs|css|wasm|svg|json)$" br;
}
# HTML wants the sign-in or invite page; everything else gets the bare status.
map $http_accept $lb_html {
  default 0;
  "~*text/html" 1;
}
map $http_x_forwarded_proto $lb_proto {
  default $scheme;
  https   https;
}
# Gate says GLL ID has been unreachable past its grace: show the "unavailable" page, not sign-in.
map $lb_reason $lb_signin_path {
  default     /auth/signin;
  unavailable /auth/unavailable;
}
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80 default_server;
  server_name _;
  server_tokens off;
  access_log off;          # no routine access logs (privacy page); errors still go to stderr
  error_log /dev/stderr warn;

  # Docker's embedded DNS; variables in proxy_pass so nginx starts even when gate is down.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $gate http://gate:8080;

  root $lb_root;
  gzip_static on;          # serves x.gz when the client accepts gzip and the br tree is not chosen
  gzip_vary off;           # Vary is set by the security-headers snippet
  etag on;
  client_max_body_size 64k; # sign-in forms only

  auth_request /_gate/check;
  auth_request_set $lb_user  $upstream_http_x_lb_user;
  auth_request_set $lb_email $upstream_http_x_lb_email;
  auth_request_set $lb_reason $upstream_http_x_lb_reason;

  error_page 401 = @signin;
  error_page 403 = @invite;
  error_page 500 502 503 504 /_errors/unavailable.html;

  # ---- gate plumbing -------------------------------------------------------------------------
  location = /_gate/check {
    internal;
    auth_request off;
    proxy_pass $gate/_gate/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $lb_proto;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
  }

  location @signin {
    auth_request off;
    if ($lb_html = 0) { return 401; }
    proxy_pass $gate$lb_signin_path;
    include /etc/nginx/snippets/proxy-gate.conf;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }
  location @invite {
    auth_request off;
    if ($lb_html = 0) { return 403; }
    proxy_pass $gate/auth/invite;
    include /etc/nginx/snippets/proxy-gate.conf;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }
  # Gate down or erroring: keep the 5xx status (fail closed) and show a static page.
  location = /_errors/unavailable.html {
    internal;
    auth_request off;
    root /usr/share/nginx/errors;
    rewrite ^ /unavailable.html break;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Public gate routes (sign-in pages, OIDC callback, direct sign-in, sign-out). No cache.
  location ^~ /auth/ {
    auth_request off;
    proxy_pass $gate;
    include /etc/nginx/snippets/proxy-gate.conf;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # WISP: session checked here and again by the gate, which pipes the socket to relay:4000.
  location ^~ /wisp/ {
    proxy_pass $gate;
    include /etc/nginx/snippets/proxy-gate.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-LB-User  $lb_user;
    proxy_set_header X-LB-Email $lb_email;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # Stopgap for the ~50 Mbit/s per-user cap (gate does not meter bandwidth): 781250 B/s = 6.25 Mbit/s per
    # socket, times the 8-socket per-user cap = 50 Mbit/s. Applies to downloads only; see docs section 5.
    limit_rate 781250;
    proxy_buffering off;
    proxy_request_buffering off;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # ---- ungated static: legal, theme assets, icon ------------------------------------------------
  location = /legal { return 301 /legal/; }
  location ^~ /legal/ {
    auth_request off;
    add_header Cache-Control "no-cache" always;
    add_header Content-Encoding $lb_enc;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri.html $uri/index.html =404;
  }
  location ^~ /theme/fonts/ {
    auth_request off;
    add_header Cache-Control "public, max-age=31536000" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  location ^~ /theme/ {
    auth_request off;
    add_header Cache-Control "no-cache" always;     # themes.css and marks change with releases
    add_header Content-Encoding $lb_enc;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  location = /favicon.svg {
    auth_request off;
    add_header Cache-Control "public, max-age=86400" always;
    add_header Content-Encoding $lb_enc;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # ---- gated app -------------------------------------------------------------------------------
  location = / {
    rewrite ^ /index.html last;
  }
  location ~ ^/(index\.html|patcher\.html|version\.json)$ {
    add_header Cache-Control "no-cache" always;     # revalidate with ETag every time
    add_header Content-Encoding $lb_enc;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  # Change log for the in-app "What's new" page (gated, always revalidated).
  location = /CHANGELOG.md {
    types { }
    default_type "text/markdown; charset=utf-8";
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  # Vendored libraries and self-hosted fonts: version in the path, so safe to cache for a year.
  location ^~ /vendor/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Encoding $lb_enc;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  location ^~ /fonts/ {
    add_header Cache-Control "public, max-age=31536000" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache" always;
    add_header Content-Encoding $lb_enc;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
}
