# Limitless Browser web tier. Fail closed: auth_request is on at server level and switched off only for
# the ungated paths (docs/ACCESS-CONTROL.md section 9). Origin is reachable only on 127.0.0.1:8580
# (Cloudflare Tunnel -> here). Build output: /usr/share/nginx/html (raw + .gz) and /usr/share/nginx/br (brotli).

# Real client IP: only trust the header from the tunnel (host loopback) and the Docker bridge gateway.
# The port is published on 127.0.0.1 only, so nothing else can reach nginx.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
real_ip_header CF-Connecting-IP;

# Brotli without the module: the build writes a parallel tree of .br-compressed files with the SAME names.
# Clients that accept br get that root; Content-Encoding is added only for the compressible types.
map $http_accept_encoding $lb_root {
  default                  /usr/share/nginx/html;
  "~*(^|[ ,])br([ ,;]|$)"  /usr/share/nginx/br;
}
map "$lb_root:$uri" $lb_enc {
  default "";
  "~^/usr/share/nginx/br:.*\.(html|js|mjs|css|wasm|svg|json|txt)$" br;
}
# HTML wants the sign-in or invite page; everything else gets the bare status.
map $http_accept $lb_html {
  default 0;
  "~*text/html" 1;
}
map $http_x_forwarded_proto $lb_proto {
  default $scheme;
  https   https;
}
# Gate says GLL ID has been unreachable past its grace: show the "unavailable" page, not sign-in.
# Maintenance mode (owner admin panel) answers non-owners the same way and gets its own page.
map $lb_reason $lb_signin_path {
  default     /auth/signin;
  unavailable /auth/unavailable;
  maintenance /auth/maintenance;
}
# Membership (docs/1.0/MEMBERSHIP.md 2): the gate answers 403 with a reason for a removed or suspended member and for an
# unsigned charter; HTML requests land on the matching page, everything else gets the bare 403. No reason: the invite page.
map $lb_reason $lb_deny_path {
  default   /auth/invite;
  removed   /auth/removed;
  suspended /auth/suspended;
  welcome   /auth/welcome;
}
# Auth cache (docs/1.0/RELAY.md 3.1): only the session cookie is the key (with the host). No session cookie: no cache.
map $http_cookie $lb_sess {
  default "";
  "~(?:^|;\s*)(?:__Host-)?lb_session=(?<s>[^;\s]+)" $s;
}
map $lb_sess $lb_auth_nocache {
  ""      1;
  default 0;
}
# Per-hop timing (RELAY.md 2.2). Seconds with ms resolution from the auth subrequest -> whole ms ("0.012" -> 12, "1.234" -> 1234).
# A cache hit has no upstream time: 0.
map $lb_gate_t $lb_gate_ms {
  default 0;
  "~^0\.0*(?<ms>[1-9]\d*)$" $ms;
  "~^(?<sec>[1-9]\d*)\.(?<frac>\d{3})$" $sec$frac;
}
# Empty (header omitted) when no auth subrequest ran, e.g. /legal/ and /theme/.
map $lb_auth_cache $lb_server_timing {
  ""      "";
  default "gate;dur=$lb_gate_ms, authcache;desc=$lb_auth_cache, edge;desc=\"$http_cf_ray\"";
}
map $lb_auth_cache $lb_xlbt {
  ""      "";
  default "gate=$lb_gate_ms;cache=$lb_auth_cache";
}
# 10 MB of tmpfs (/var/cache/nginx), entries live 5 s; 200 answers only (see the check location).
proxy_cache_path /var/cache/nginx/lbauth levels=1 keys_zone=lbauth:1m max_size=10m inactive=30s use_temp_path=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80 default_server;
  server_name _;
  server_tokens off;
  access_log off;          # no routine access logs (privacy page); errors still go to stderr
  error_log /dev/stderr warn;

  # Docker's embedded DNS; variables in proxy_pass so nginx starts even when gate is down.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $gate http://lbgate:8080;

  root $lb_root;
  gzip_static on;          # serves x.gz when the client accepts gzip and the br tree is not chosen
  gzip_vary off;           # Vary is set by the security-headers snippet
  etag on;
  client_max_body_size 64k; # sign-in forms only

  auth_request /_gate/check;
  auth_request_set $lb_user  $upstream_http_x_lb_user;
  auth_request_set $lb_email $upstream_http_x_lb_email;
  auth_request_set $lb_reason $upstream_http_x_lb_reason;
  auth_request_set $lb_gate_t $upstream_response_time;
  auth_request_set $lb_auth_cache $upstream_cache_status;

  error_page 401 = @signin;
  error_page 403 = @invite;
  error_page 500 502 503 504 /_errors/unavailable.html;

  # ---- gate plumbing -------------------------------------------------------------------------
  location = /_gate/check {
    internal;
    auth_request off;
    proxy_pass $gate/_gate/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $lb_proto;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    # Auth cache: keyed on host + session cookie, 5 s, 200 only. 401 and 403 have no proxy_cache_valid, so they are never
    # stored. The gate answers Cache-Control: no-store, which nginx would honour, so that header is ignored here on purpose.
    # Revoke deletes the session at once; a cached "allowed" lasts at most 5 s for app files, and a new WISP socket is
    # checked again by the gate itself. Kill switch: delete the proxy_cache line (or the whole block) and reload.
    proxy_cache lbauth;
    proxy_cache_key "$host|$lb_sess";
    proxy_cache_valid 200 5s;
    proxy_ignore_headers Cache-Control Expires;
    proxy_cache_bypass $lb_auth_nocache;
    proxy_no_cache $lb_auth_nocache;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 3s;
  }

  location @signin {
    auth_request off;
    if ($lb_html = 0) { return 401; }
    proxy_pass $gate$lb_signin_path;
    include /etc/nginx/snippets/proxy-gate.conf;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }
  location @invite {
    auth_request off;
    if ($lb_html = 0) { return 403; }
    proxy_pass $gate$lb_deny_path;
    include /etc/nginx/snippets/proxy-gate.conf;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }
  # Gate down or erroring: keep the 5xx status (fail closed) and show a static page.
  location = /_errors/unavailable.html {
    internal;
    auth_request off;
    root /usr/share/nginx/errors;
    rewrite ^ /unavailable.html break;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Designed welcome ceremony (docs/1.0/UI.md 6.1): the page and its assets come from this tree, the data from the gate's JSON routes
  # under /auth/welcome (state, number, step, sign). Exact match beats ^~ /auth/. The page holds no data and shows an error without the gate.
  location = /auth/welcome {
    auth_request off;
    rewrite ^ /theme/ceremony/index.html break;
    add_header Cache-Control "no-store" always;
    add_header Content-Encoding $lb_enc;
    include /etc/nginx/snippets/security-headers.conf;
  }
  # Ceremony assets: ungated because a member in the welcome state is refused by the gate everywhere else.
  location ~ ^/theme/(ceremony/|fonts/|fonts\.css$|themes\.css$) {
    auth_request off;
    add_header Cache-Control "no-cache" always;
    add_header Content-Encoding $lb_enc;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # Public gate routes (sign-in pages, OIDC callback, direct sign-in, sign-out). No cache.
  location ^~ /auth/ {
    auth_request off;
    proxy_pass $gate;
    include /etc/nginx/snippets/proxy-gate.conf;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Member status (membership payload and busy flag). Gated like everything else; small JSON, never cached.
  location = /_lb/me {
    proxy_pass $gate;
    include /etc/nginx/snippets/proxy-gate.conf;
    proxy_set_header X-LB-User $lb_user;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Report a problem (1.0 S7): gated, small JSON, never cached. The gate checks the session and Origin itself.
  location = /_lb/report {
    limit_except POST { deny all; }
    client_max_body_size 8k;
    proxy_pass $gate;
    include /etc/nginx/snippets/proxy-gate.conf;
    proxy_set_header X-LB-User $lb_user;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Paid tiers (1.0 S9), 24 h trial: gated, small JSON POST, never cached. The gate checks the session, Origin and plans_open itself.
  location = /_lb/trial {
    limit_except POST { deny all; }
    client_max_body_size 4k;
    proxy_pass $gate;
    include /etc/nginx/snippets/proxy-gate.conf;
    proxy_set_header X-LB-User $lb_user;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Paid tiers (1.0 S9), plan request form: gated, small JSON POST, never cached. The gate checks the session, Origin and plans_open itself.
  location = /_lb/plan-request {
    limit_except POST { deny all; }
    client_max_body_size 4k;
    proxy_pass $gate;
    include /etc/nginx/snippets/proxy-gate.conf;
    proxy_set_header X-LB-User $lb_user;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Paid tiers (1.0 S9), Load Now (Executive): gated, small JSON POST, never cached. The gate checks the session, Origin and plans_open itself.
  location = /_lb/load-now {
    limit_except POST { deny all; }
    client_max_body_size 4k;
    proxy_pass $gate;
    include /etc/nginx/snippets/proxy-gate.conf;
    proxy_set_header X-LB-User $lb_user;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Paid tiers (1.0 S9), anonymous load-time sample: gated, small JSON POST, never cached. The gate checks the session, Origin and plans_open itself.
  location = /_lb/perf {
    limit_except POST { deny all; }
    client_max_body_size 4k;
    proxy_pass $gate;
    include /etc/nginx/snippets/proxy-gate.conf;
    proxy_set_header X-LB-User $lb_user;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # VPS relay token (1.0 S4): gated like everything else; the gate checks the session and Origin itself and answers 404
  # unless RELAY_PUBLIC_URL is set (the app then keeps public relays).
  location = /_lb/relay-token {
    proxy_pass $gate;
    include /etc/nginx/snippets/proxy-gate.conf;
    proxy_set_header X-LB-User $lb_user;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    client_max_body_size 1k;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Certificate PDF (S5): gated like everything else; generated by the gate per request, never cached.
  location = /_lb/me/certificate.pdf {
    proxy_pass $gate;
    include /etc/nginx/snippets/proxy-gate.conf;
    proxy_set_header X-LB-User $lb_user;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # The VPS relay polls this every second (1.0 S4). No session: the gate checks the shared secret (Bearer) itself and
  # answers 404 unless the VPS relay is configured. Small JSON only, never cached. Nothing is opened at home.
  location = /_lb/relay/sync {
    auth_request off;
    proxy_pass $gate;
    include /etc/nginx/snippets/proxy-gate.conf;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    client_max_body_size 512k;
    add_header Cache-Control "no-store" always;
  }

  # Public verify status for HALL and certificate QR codes (S5, MEMBERSHIP 7): UNGATED on purpose. JSON with status, number, tier and
  # admitted date only, never a name. The gate rate limits it per IP. Besides the relay sync route above (authenticated by
  # its shared secret in the gate), nothing else under /_lb/ may ever be ungated.
  location ^~ /_lb/verify/ {
    auth_request off;
    proxy_pass $gate;
    include /etc/nginx/snippets/proxy-gate.conf;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Owner admin API (limitless://admin). Gated like everything else; the check service answers 404 to anyone but
  # the owner and ADMIN_PANEL=off turns it off. Small JSON bodies only, never cached.
  location ^~ /_lb/admin/ {
    proxy_pass $gate;
    include /etc/nginx/snippets/proxy-gate.conf;
    proxy_set_header X-LB-User $lb_user;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    client_max_body_size 16k;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # WISP: our relay is off in 0.3.0 (public relays only until 1.0). /tmp/wisp.conf is written at start by deploy/web/wisp.sh:
  # `return 410;` by default, the proxy block (snippets/wisp-proxy.conf) when WISP_RELAY=1 (rehearsal tests keep a working relay).
  location ^~ /wisp/ {
    include /tmp/wisp.conf;
  }

  # ---- ungated static: legal, theme assets, icon ------------------------------------------------
  location = /legal { return 301 /legal/; }
  location ^~ /legal/ {
    auth_request off;
    include /tmp/legal-v2.conf;   # written at start from LEGAL_VERSION; empty while dark (deploy/web/legal-v2.sh)
    add_header Cache-Control "no-cache" always;
    add_header Content-Encoding $lb_enc;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri.html $uri/index.html =404;
  }
  # Skins CSS (lazy, only for users who pick a skin): lives under /theme/ but is NOT public. Exact match wins over the
  # ^~ /theme/ prefix below, so it keeps the server-level auth_request like the rest of the app.
  location = /theme/skins.css {
    add_header Cache-Control "no-cache" always;
    add_header Content-Encoding $lb_enc;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  location ^~ /theme/fonts/ {
    auth_request off;
    add_header Cache-Control "public, max-age=31536000" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  location ^~ /theme/ {
    auth_request off;
    add_header Cache-Control "no-cache" always;     # themes.css and marks change with releases
    add_header Content-Encoding $lb_enc;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  location = /favicon.svg {
    auth_request off;
    add_header Cache-Control "public, max-age=86400" always;
    add_header Content-Encoding $lb_enc;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # ---- gated app -------------------------------------------------------------------------------
  location = / {
    rewrite ^ /index.html last;
  }
  # Service worker: gated (a signed-out browser cannot fetch or update it), always revalidated, scope /.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header Content-Encoding $lb_enc;
    add_header Service-Worker-Allowed "/" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  location ~ ^/(index\.html|patcher\.html|version\.json)$ {
    add_header Cache-Control "no-cache" always;     # revalidate with ETag every time
    add_header Content-Encoding $lb_enc;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  # Change log for the in-app "What's new" page (gated, always revalidated).
  location = /CHANGELOG.md {
    types { }
    default_type "text/markdown; charset=utf-8";
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  # Vendored libraries and self-hosted fonts: version in the path, so safe to cache for a year.
  location ^~ /vendor/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Encoding $lb_enc;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  # Lazy app modules, path carries the build sha (scripts/build-static.sh): immutable, gated.
  location ^~ /app/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Encoding $lb_enc;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  location ^~ /fonts/ {
    add_header Cache-Control "public, max-age=31536000" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache" always;
    add_header Content-Encoding $lb_enc;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
}
