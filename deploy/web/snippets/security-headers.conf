# add_header is not inherited once a location sets its own, so every location includes this file.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# frame-ancestors only. A full CSP waits for testing (the proxy injects scripts); see docs/HOSTING-AND-PERFORMANCE.md.
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header Vary "Accept-Encoding" always;
# Per-hop timing (docs/1.0/RELAY.md 2.2): gate auth time, auth cache hit or miss, Cloudflare ray id. Omitted (empty) when no auth ran.
add_header Server-Timing $lb_server_timing always;
