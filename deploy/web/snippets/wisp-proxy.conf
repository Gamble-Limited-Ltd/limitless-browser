# Proxy block of `location ^~ /wisp/` (session checked by nginx and again by the gate, which pipes the socket to relay:4000).
# Included through /tmp/wisp.conf only when WISP_RELAY=1 (deploy/web/wisp.sh); prod answers 410 since 0.3.0.
proxy_pass $gate;
include /etc/nginx/snippets/proxy-gate.conf;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header X-LB-User  $lb_user;
proxy_set_header X-LB-Email $lb_email;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
# Per-user bandwidth is enforced in the check service (BANDWIDTH_MBPS), not here.
proxy_buffering off;
proxy_request_buffering off;
add_header Cache-Control "no-store" always;
add_header X-LB-T $lb_xlbt always;   # per-hop timing on the upgrade response (RELAY.md 2.2)
include /etc/nginx/snippets/security-headers.conf;
