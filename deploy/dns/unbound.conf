# Caching resolver for the relay only. Reached on the internal lb_relay network; forwards over DNS-over-TLS.
# Destination checks in epoxy run on the resolved address, so DNS rebinding protection is unchanged.
server:
  interface: 0.0.0.0
  port: 53
  access-control: 0.0.0.0/0 allow     # lb_relay is an internal network (gate and relay only); nothing is published
  do-ip6: no
  username: ""
  chroot: ""
  pidfile: ""
  use-syslog: no
  logfile: ""
  verbosity: 0
  hide-identity: yes
  hide-version: yes
  # Positive answers follow their TTL up to 1 h, negative answers 60 s, expiring entries are refreshed in the background.
  cache-max-ttl: 3600
  cache-min-ttl: 0
  cache-max-negative-ttl: 60
  prefetch: yes
  serve-expired: yes
  serve-expired-ttl: 3600
  msg-cache-size: 8m
  rrset-cache-size: 16m
  num-threads: 2
  tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

forward-zone:
  name: "."
  forward-tls-upstream: yes
  forward-addr: 1.1.1.1@853#cloudflare-dns.com
  forward-addr: 9.9.9.9@853#dns.quad9.net
