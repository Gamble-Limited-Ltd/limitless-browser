name: test
# Unit tests plus the full e2e suite (npm test), 4 shards. No secrets, no deploy. Public repo: logs are public.
on:
  push:
  workflow_dispatch:
    inputs:
      projects:
        description: 'Playwright projects, comma separated (cb-low,cb-mid,cb-high exist once the profiles branch is merged)'
        default: 'chromium,chromebook'

permissions:
  contents: read

# Date-based e2e tests assume the VM's time zone (CI runners are UTC)
env:
  TZ: America/Chicago

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: if ls tests/unit/*.test.mjs >/dev/null 2>&1; then npm run test:unit; else echo "no unit tests"; fi

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pw
        run: echo "v=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - name: Install Chromium
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = true ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi
      - name: Run shard ${{ matrix.shard }} of 4
        env:
          PROJECTS: ${{ inputs.projects || 'chromium,chromebook' }}
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json
        run: |
          args=(); IFS=, read -ra P <<< "$PROJECTS"; for p in "${P[@]}"; do args+=(--project="$p"); done
          npx playwright test "${args[@]}" --shard=${{ matrix.shard }}/4 --reporter=list,html,json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
